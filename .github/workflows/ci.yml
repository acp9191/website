name: CI

on:
  pull_request:

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Single source of truth, kept in step with engines.node in package.json
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: installs exactly what the lockfile
      # pins and fails if package.json and the lockfile have drifted apart.
      - run: npm ci

      # Every check below runs even if an earlier one failed, so one push
      # reports every problem rather than revealing them one at a time.

      # The script passes --max-warnings 0, so warnings fail the run too.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Format
        if: '!cancelled()'
        run: npm run format:check

      # Frontmatter mistakes do not fail a build — a movie whose image key is
      # `cover` rather than `poster` just renders a card with no image.
      - name: Content
        if: '!cancelled()'
        run: npm run check:content

      # Lint and typecheck between them miss anything that only breaks while
      # building: the Serwist service-worker compile, and the prerender of all
      # 28 localized pages.
      - name: Build
        if: '!cancelled()'
        run: npm run build
