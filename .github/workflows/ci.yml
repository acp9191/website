name: CI

on:
  pull_request:

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Pinned rather than ubuntu-latest, so the OS changes when this line does
    # and not when GitHub moves the label.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Single source of truth, kept in step with engines.node in package.json
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: installs exactly what the lockfile
      # pins and fails if package.json and the lockfile have drifted apart.
      - run: npm ci

      # Every check below runs even if an earlier one failed, so one push
      # reports every problem rather than revealing them one at a time.

      # The script passes --deny-warnings, so warnings fail the run too.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Format
        if: '!cancelled()'
        run: npm run format:check

      # Frontmatter mistakes do not fail a build — a movie whose image key is
      # `cover` rather than `poster` just renders a card with no image.
      - name: Content
        if: '!cancelled()'
        run: npm run check:content

      - name: Unit tests
        if: '!cancelled()'
        run: npm run test

      # Next's incremental build cache. Keyed on the lockfile plus every source
      # file, falling back to the newest cache for the same lockfile, so a
      # typical PR push only recompiles what it touched.
      - name: Cache Next build
        if: '!cancelled()'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'content/**', 'messages/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Lint and typecheck between them miss anything that only breaks while
      # building: the Serwist service-worker compile, and the prerender of every
      # localized page. `postbuild` also fails here if no service worker was
      # emitted, which is what a bare Turbopack build silently does.
      - name: Build
        if: '!cancelled()'
        run: npm run build

      # Keyed on the resolved Playwright version so the browser is re-downloaded
      # only when that changes, rather than on every run.
      - name: Resolve Playwright version
        if: '!cancelled()'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        if: '!cancelled()'
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Headless runs only use chromium-headless-shell, so that is all this
      # fetches. No `--with-deps`: the runner image ships Google Chrome, so the
      # system libraries Chromium needs are already installed, and the apt step
      # cost more (~30s) than the download it accompanied.
      - name: Install Playwright browser
        if: "!cancelled() && steps.pw-cache.outputs.cache-hit != 'true'"
        run: npx playwright install --only-shell chromium

      # Runs against `npm start`, i.e. the build produced above. These cover the
      # regressions that only appear in a production build: the service worker,
      # the prerendered metadata, and the theme surviving a locale switch.
      - name: End-to-end tests
        if: '!cancelled()'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
